	<script>
	window.__yaakobBegin = function() {
		if (window.__yaakobRedirecting) return;
		window.__yaakobRedirecting = true;

		var stage = document.getElementById('Stage');
		var canvas = document.querySelector('canvas');
		var target = stage || canvas || document.body;
		var blackout = document.getElementById('yaakob-blackout');

		// Dispersion: bright flash + blur dissolve
		target.style.animation = 'particleDissolve 1.8s cubic-bezier(0.4, 0, 0.2, 1) forwards';

		// Fade to dark underneath
		setTimeout(function() {
			blackout.style.transition = 'opacity 0.8s ease';
			blackout.style.opacity = '1';
		}, 600);

		// Navigate
		setTimeout(function() {
			window.location.href = '/apps';
		}, 1800);
	};

	// Mobile preloader auto-advance.
	// On touch devices the experience shows a canvas "_ TOCA PARA COMENZAR _"
	// gate that only advances on a touch of the canvas (the engine binds touch,
	// not mouse, on mobile). Some users got stuck there — either tapping before
	// the engine's touch listener was ready, or not realizing a tap was needed.
	// We synthesize the touch automatically and retry until the home (YAAKOB /
	// BE FREE, with its DOM "COMENZAR" button) appears — same page (/), no
	// redirect. From there the BE FREE button continues the flow normally.
	(function() {
		var isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
		if (!isTouch) return; // desktop never shows the gate

		// The home (BE FREE) renders a real DOM element whose text is exactly
		// "COMENZAR" (the button). The gate's text is drawn on the canvas only,
		// so this is a reliable "we've advanced past the gate" signal.
		function onHome() {
			var els = document.querySelectorAll('button, a, span, div');
			for (var i = 0; i < els.length; i++) {
				if (els[i].children.length === 0 &&
				    (els[i].textContent || '').trim().toUpperCase() === 'COMENZAR') return true;
			}
			return false;
		}

		function tapCanvas() {
			var canvas = document.querySelector('#Stage canvas') || document.querySelector('canvas');
			if (!canvas) return;
			var r = canvas.getBoundingClientRect();
			if (!r.width || !r.height) return;
			// Tap near the top of the canvas, away from the BE FREE button, so a
			// stray late tap can never hit "COMENZAR".
			var x = r.left + r.width / 2, y = r.top + r.height * 0.12;
			try {
				var t = new Touch({ identifier: 1, target: canvas, clientX: x, clientY: y,
					pageX: x, pageY: y, radiusX: 10, radiusY: 10, force: 1 });
				canvas.dispatchEvent(new TouchEvent('touchstart', { bubbles: true, cancelable: true,
					composed: true, touches: [t], targetTouches: [t], changedTouches: [t] }));
				canvas.dispatchEvent(new TouchEvent('touchend', { bubbles: true, cancelable: true,
					composed: true, touches: [], targetTouches: [], changedTouches: [t] }));
			} catch (e) {
				// No Touch constructor: fall back to pointer + mouse.
				['pointerdown', 'mousedown', 'pointerup', 'mouseup', 'click'].forEach(function(type) {
					var Ctor = (type.indexOf('pointer') === 0 && window.PointerEvent) ? PointerEvent : MouseEvent;
					try { canvas.dispatchEvent(new Ctor(type, { bubbles: true, cancelable: true, clientX: x, clientY: y })); } catch (_) {}
				});
			}
		}

		var tries = 0, iv = setInterval(function() {
			if (onHome()) { clearInterval(iv); return; } // advanced into the home
			tapCanvas();
			if (++tries > 50) clearInterval(iv); // ~25s ceiling, then give up
		}, 500);
	})();
	</script>
